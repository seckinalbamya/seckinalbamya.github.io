<article class="relative group flex flex-row">
	<a class="insert-link" href="{{ .Permalink }}"></a>
	<figure class="thumb basis-1/3 self-center overflow-hidden rounded-2xl bg-zinc-100">

		{{- if .Params.image }}

		  {{- if (strings.HasPrefix .Params.image "http") }}

		  <img class="thumb-img group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ .Params.image }}" alt="{{ $.Name }}">

		  {{- else }}

			{{- with $imglist := resources.Get .Params.image -}}
			  {{- $imglist := $imglist.Resize "500x" -}}
			  <img class="thumb-img group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $imglist.Permalink }}" alt="{{ $.Name }}" width="{{ $imglist.Width }}" height="{{ $imglist.Height }}">
			{{- end }}

		  {{- end }}

		{{- end }}

	</figure>
	<div class="basis-2/3 self-center ml-4">
		<h3 class="font-bold group-hover:underline decoration-auto">{{ .LinkTitle }}</h3>
	</div>
</article>
