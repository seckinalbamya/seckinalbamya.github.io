baseURL = 'https://vhdlverilog.com/'
defaultContentLanguage = 'tr'
defaultContentLanguageInSubdir = false
title = 'VHDLVerilog'
theme = 'pehtheme-hugo'
buildFuture = true

paginate = '6' # <- Set the desired number of posts per page 
summaryLength = '20' # <- 20 words are approximately 160 characters
googleAnalytics = '' # <- Your GA-4
disqusShortname = '' # <- Get form here : https://disqus.com

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


[params]
	# Meta description, not exceeding 160 characters, used for the meta description within the HTML head
	description = 'vhdlverilog.com'
	mainSections = 'posts'

[author]
	name = 'Seçkin Albamya'
	bio = 'FPGA ve gömülü sistemler ve insansız hava araçları üzerine çalışma yapan elektronik meraklısı'
	avatar = '/images/seckin_pp.jpg'

[languages]
  [languages.tr]
    languageCode = 'tr-TR'
    languageName = 'Türkçe'
    weight = 1
    [languages.tr.params]
      description = 'vhdlverilog.com'
    [[languages.tr.menus.main]]
      name = 'Ana Sayfa'
      pageRef = '/'
      weight = 10
    [[languages.tr.menus.main]]
      name = 'Hakkında'
      pageRef = '/hakkinda'
      weight = 15
  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    weight = 2
    [languages.en.params]
      description = 'FPGA, VHDL and Verilog tutorials - vhdlverilog.com'
    [[languages.en.menus.main]]
      name = 'Home'
      pageRef = '/'
      weight = 10
    [[languages.en.menus.main]]
      name = 'About'
      pageRef = '/hakkinda'
      weight = 15

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"
  [module.mounts] # Directing the static folder to assets
  	source = 'assets'
  	target = 'static'
